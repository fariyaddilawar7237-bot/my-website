<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First API Website</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 80px; background: #f4f4f9; }
    .box { background: white; padding: 30px; max-width: 450px; margin: auto; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    button { padding: 10px 20px; font-size: 16px; background: #2ea44f; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #2c974b; }
    p { font-size: 18px; color: #333; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Live API Demo Website</h2>
    <p id="advice-text">Naya advice dekhne ke liye button dabayein!</p>
    <button onclick="getAdvice()">Get New Advice (API)</button>
  </div>

  <script>
    async function getAdvice() {
      document.getElementById('advice-text').innerText = "Loading...";
      const response = await fetch('https://api.adviceslip.com/advice');
      const data = await response.json();
      document.getElementById('advice-text').innerText = data.slip.advice;
    }
  </script>
</body>
</html>
